<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Background Remover</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #89f7fe, #66a6ff);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: #fff;
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 450px;
        width: 90%;
    }

    h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 26px;
    }

    input[type="file"] {
        display: none;
    }

    label {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-block;
        font-size: 15px;
        margin-bottom: 15px;
        transition: 0.3s;
    }

    label:hover {
        background: #0056d2;
    }

    #preview {
        width: 100%;
        max-height: 250px;
        object-fit: contain;
        margin: 10px 0;
        border-radius: 10px;
        display: none;
    }

    button {
        background: #28a745;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #218838;
    }

    h2 {
        margin-top: 25px;
        color: #444;
    }

    #resultImg {
        width: 100%;
        max-height: 300px;
        object-fit: contain;
        border-radius: 10px;
        margin-top: 10px;
        display: none;
    }

    #loading {
        display: none;
        color: #666;
        font-size: 15px;
        margin-top: 10px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>🪄 Background Remover</h1>

    <label for="imageInput">📁 Pilih Gambar</label>
    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" src="" alt="Preview">

    <button id="submitBtn">Hapus Background</button>
    <p id="loading">⏳ Sedang memproses...</p>

    <h2>Hasil:</h2>
    <img id="resultImg" src="" alt="Hasil akan muncul di sini">
</div>

<script>
const imageInput = document.getElementById("imageInput");
const submitBtn = document.getElementById("submitBtn");
const resultImg = document.getElementById("resultImg");
const preview = document.getElementById("preview");
const loading = document.getElementById("loading");

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
});

submitBtn.addEventListener("click", async () => {
    const file = imageInput.files[0];
    if (!file) return alert("Silakan upload gambar terlebih dahulu!");

    loading.style.display = "block";
    resultImg.style.display = "none";

    const formData = new FormData();
    formData.append("image", file, "image.png");

    try {
        const response = await fetch("https://umscorleonis-background-remover-space.hf.space/remove-bg", {
            method: "POST",
            body: formData
        });
        const data = await response.json();

        if (data.result_base64) {
            resultImg.src = "data:image/png;base64," + data.result_base64;
            resultImg.style.display = "block";
        } else {
            console.error(data);
            alert("❌ Gagal mendapatkan hasil. Cek console.");
        }
    } catch (err) {
        console.error(err);
        alert("❌ Terjadi error saat request.");
    } finally {
        loading.style.display = "none";
    }
});
</script>
</body>
</html>
